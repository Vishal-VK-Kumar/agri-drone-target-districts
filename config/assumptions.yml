# Analysis assumptions read by the marts stage. Nothing downstream should
# hardcode a year or a unit conversion - the marts read every value here from
# staging.assumptions (loaded from seeds/assumptions.csv, which must be kept
# in sync with this file), not from a literal in a query.

trend_start_year: "2014-15"
trend_start_year_reason: >
  2013-14 stays in the fact table, flagged, but is excluded from trend
  measures: it carries the nine-district Chhattisgarh coverage gap, plus four
  boundary events that land between 2013-14 and 2014-15 (Gujarat's seven new
  districts, Palghar, Alipurduar, the Khammam-to-Godavari transfer). See
  docs/district_alias_notes.md, "Trend window".

latest_complete_year: "2023-24"
latest_complete_year_reason: >
  2024-25 is missing reports from five states, so 2023-24 is the newest year
  with full state coverage. See docs/district_alias_notes.md, "Trend window".

nutrient_passes_per_crop_season: 2
nutrient_passes_per_crop_season_source: >
  IFFCO nano urea application guide, https://nanourea.in/en/application;
  scheme coverage for liquid fertilisers and pesticides via Lead Fertiliser
  Companies: PIB press release, PRID 2070029, 1 Nov 2024.
nutrient_passes_per_crop_season_reason: >
  A manufacturer's recommendation, uniform across crops ("can be increased or
  decreased depending upon crop"), kept separate from plant-protection passes
  so the dashboard can switch nutrient passes off. See
  docs/spray_passes_notes.md, "Two kinds of pass, kept separate".

hectare_to_acre: 2.471
hectare_to_acre_source: >
  Standard unit conversion (1 hectare = 2.47105 acres, rounded to 3 dp).
